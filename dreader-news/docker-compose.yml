version: '3.8'
services:
  postgres:
    image: postgres:18.1-alpine
    container_name: dreader-news
    environment:
      POSTGRES_DB: dreader_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:8.4.0-alpine
    container_name: dreader-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: