version: '3.9'
services:
  postgres:
    image: postgres:18-alpine
    container_name: dreader-news
    environment:
      POSTGRES_DB: dreader_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: